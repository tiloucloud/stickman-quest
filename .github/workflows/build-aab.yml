name: Build Android AAB

# Runs on every push to main, and from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Copy the game into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          [ -f icon-512.png ] && cp icon-512.png android/app/src/main/assets/ || true

      - name: Decode upload keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-key.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is missing - the AAB will be UNSIGNED and Google Play will refuse it."
          fi

      - name: Build release AAB and test APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ env.SIGNED == '1' && 'upload-key.jks' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleDebug

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: stickman-quest-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload test APK (install on your phone)
        uses: actions/upload-artifact@v4
        with:
          name: stickman-quest-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save build outputs to the 'builds' branch
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/out/StickmanQuest-release.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/StickmanQuest.apk
          cd /tmp/out
          git init -q -b builds
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds

      - name: Remove keystore
        if: always()
        run: rm -f android/app/upload-key.jks
